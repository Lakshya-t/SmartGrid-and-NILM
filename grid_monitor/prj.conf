# ---- floating point on the Cortex-M4F, shared by several threads ----
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# (STM32 HAL modules are selected in the Kconfig file of this app)

# ---- CMSIS-DSP (real FFT) ----
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y

# ---- message passing between threads ----
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# ---- flash log (NVS) ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_CRC=y

# ---- UART shell, kernel inspection ("kernel threads") ----
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=5
CONFIG_SHELL_STACK_SIZE=3072

# ---- logging goes through the shell ----
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# ---- keep the firmware inside the 256 KB "code" partition (see overlay) ----
CONFIG_USE_DT_CODE_PARTITION=y

# ---- zbus: fixed-size buffers, no heap use from the protection thread ----
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=64
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16
